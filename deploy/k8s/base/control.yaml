# Control plane: ONE replica (single-writer WAL on a PersistentVolume). Not HA by design.
apiVersion: v1
kind: Service
metadata:
  name: kestrel-control
  labels: {app.kubernetes.io/name: kestrel-control}
spec:
  selector: {app.kubernetes.io/name: kestrel-control}
  ports:
    - {name: grpc, port: 7000, targetPort: grpc}
    - {name: metrics, port: 9090, targetPort: metrics}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kestrel-control
spec:
  serviceName: kestrel-control
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kestrel-control}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kestrel-control}
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
        fsGroup: 10001          # so the non-root process can write the PVC
      containers:
        - name: control
          image: kestrel
          imagePullPolicy: IfNotPresent
          command: ["kestrel_control"]
          args:
            - --listen=0.0.0.0:7000
            - --metrics-port=9090
            - --wal-path=/data/kestrel.wal
            - --wal-sync=every
            - --policy=best-fit
            - --suspect-after-ms=3000
            - --dead-after-ms=5000
          ports:
            - {name: grpc, containerPort: 7000}
            - {name: metrics, containerPort: 9090}
          readinessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: wal, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: wal
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 1Gi}
